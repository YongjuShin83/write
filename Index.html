<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  :root { --bg:#faf7f2; --card:#fff; --ink:#2b2621; --sub:#7a6f63; --line:#e6dfd4; --accent:#8a5a2b; --ok:#2f7d4f; --warn:#b4541f; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system, "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; font-size:15px; }
  header { background:var(--accent); color:#fff; padding:14px 16px; font-weight:700; font-size:17px; }
  nav { display:flex; background:var(--card); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; }
  nav button { flex:1; padding:12px 0; border:0; background:none; font-size:15px; color:var(--sub); border-bottom:3px solid transparent; cursor:pointer; }
  nav button.on { color:var(--accent); border-color:var(--accent); font-weight:700; }
  main { max-width:860px; margin:0 auto; padding:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:14px; }
  label { display:block; font-size:13px; color:var(--sub); margin:12px 0 4px; }
  input[type=text], input[type=url], input[type=password], input[type=datetime-local], textarea, select {
    width:100%; padding:10px; border:1px solid var(--line); border-radius:8px; font:inherit; background:#fff; }
  textarea { min-height:110px; resize:vertical; line-height:1.5; }
  .row { display:flex; gap:10px; flex-wrap:wrap; }
  .row > * { flex:1; min-width:140px; }
  .btn { padding:10px 16px; border-radius:8px; border:1px solid var(--accent); background:var(--accent); color:#fff; font:inherit; cursor:pointer; }
  .btn.ghost { background:#fff; color:var(--accent); }
  .btn:disabled { opacity:.5; cursor:default; }
  .btns { display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; }
  .checks { display:flex; gap:16px; flex-wrap:wrap; margin-top:6px; }
  .checks label { display:flex; align-items:center; gap:6px; margin:0; color:var(--ink); font-size:15px; }
  .tabs { display:flex; gap:6px; margin-top:16px; }
  .tabs button { padding:8px 12px; border:1px solid var(--line); background:#fff; border-radius:8px 8px 0 0; cursor:pointer; font:inherit; }
  .tabs button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .pane { border:1px solid var(--line); border-radius:0 8px 8px 8px; padding:12px; }
  .photos { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
  .photos a { font-size:13px; color:var(--accent); }
  .item { padding:12px 0; border-bottom:1px solid var(--line); cursor:pointer; }
  .item:last-child { border:0; }
  .item b { display:block; margin-bottom:4px; }
  .chip { display:inline-block; font-size:12px; padding:2px 8px; border-radius:20px; margin-right:4px; background:#eee; color:#555; }
  .chip.완료 { background:#e2f2e8; color:var(--ok); }
  .chip.대기 { background:#fdf0e1; color:var(--warn); }
  .chip.실패 { background:#fde4e4; color:#b42318; }
  .muted { color:var(--sub); font-size:13px; }
  #toast { position:fixed; left:50%; bottom:20px; transform:translateX(-50%); background:#2b2621; color:#fff; padding:10px 16px; border-radius:8px; display:none; max-width:90%; z-index:9; }
  .hidden { display:none; }
  .count { float:right; font-size:12px; color:var(--sub); }
</style>
</head>
<body>
<header>골목상회 게시글 관리</header>
<nav>
  <button data-view="write" class="on">글쓰기</button>
  <button data-view="list">게시 현황</button>
  <button data-view="settings">설정</button>
</nav>

<main>
  <!-- 글쓰기 -->
  <section id="view-write">
    <div class="card">
      <div class="muted" id="editing">새 글</div>
      <label>제목</label>
      <input type="text" id="f-제목" placeholder="예) 햇들기름 첫 착유, 이번 주 공동구매">
      <label>본문 (원문 한 번만 쓰세요)</label>
      <textarea id="f-본문" placeholder="오늘 볶은 들깨로 짠 햇들기름이 나왔어요..."></textarea>
      <div class="row">
        <div><label>링크 (공구·스토어)</label><input type="url" id="f-링크" placeholder="https://golmok.ai.kr/..."></div>
        <div><label>해시태그 (띄어쓰기로 구분)</label><input type="text" id="f-해시태그" placeholder="들기름 방앗간 골목상회"></div>
      </div>
      <label>사진</label>
      <input type="file" id="photoInput" accept="image/*" multiple>
      <div class="photos" id="photoList"></div>
      <input type="hidden" id="f-사진">

      <label>올릴 곳</label>
      <div class="checks">
        <label><input type="checkbox" id="ch-band" checked> 밴드 (자동)</label>
        <label><input type="checkbox" id="ch-blog" checked> 네이버 블로그</label>
        <label><input type="checkbox" id="ch-carrot" checked> 당근</label>
      </div>
      <div class="row">
        <div><label>밴드 예약 게시 (비우면 '지금 올리기'로 직접)</label><input type="datetime-local" id="f-예약일시"></div>
      </div>

      <div class="btns"><button class="btn ghost" id="genBtn">채널별 글 만들기</button></div>

      <div class="tabs">
        <button data-pane="band" class="on">밴드</button>
        <button data-pane="blog">블로그</button>
        <button data-pane="carrot">당근</button>
      </div>
      <div class="pane">
        <div id="pane-band">
          <span class="count" id="cnt-밴드글"></span>
          <textarea id="f-밴드글" style="min-height:200px"></textarea>
        </div>
        <div id="pane-blog" class="hidden">
          <label style="margin-top:0">블로그 제목</label>
          <input type="text" id="f-블로그제목">
          <label>블로그 본문</label>
          <textarea id="f-블로그글" style="min-height:220px"></textarea>
        </div>
        <div id="pane-carrot" class="hidden">
          <span class="count" id="cnt-당근글"></span>
          <div class="muted">당근 피드에는 첫 줄만 보여요. 첫 줄을 가장 궁금하게 써 주세요.</div>
          <textarea id="f-당근글" style="min-height:200px"></textarea>
        </div>
      </div>

      <label>메모</label>
      <input type="text" id="f-메모" placeholder="내부 메모 (게시되지 않음)">

      <div class="btns">
        <button class="btn" id="saveBtn">저장</button>
        <button class="btn ghost" id="bandNowBtn">저장 후 밴드에 지금 올리기</button>
        <button class="btn ghost" id="askBtn">블로그·당근 게시 요청 문구 복사</button>
        <button class="btn ghost" id="newBtn">새 글</button>
      </div>
    </div>
  </section>

  <!-- 게시 현황 -->
  <section id="view-list" class="hidden">
    <div class="card">
      <div class="btns" style="margin-top:0"><button class="btn ghost" id="reloadBtn">새로고침</button></div>
      <div id="list"><div class="muted">불러오는 중…</div></div>
    </div>
  </section>

  <!-- 설정 -->
  <section id="view-settings" class="hidden">
    <div class="card">
      <b>밴드 연결</b>
      <div class="muted" id="tokenState"></div>
      <label>밴드 Access Token</label>
      <input type="password" id="s-token" placeholder="developers.band.us 에서 발급">
      <div class="btns"><button class="btn" id="saveTokenBtn">토큰 저장 후 밴드 목록 불러오기</button></div>
      <label>게시할 밴드</label>
      <select id="s-band"><option value="">(토큰 저장 후 선택)</option></select>
      <div class="checks" style="margin-top:12px">
        <label><input type="checkbox" id="s-push"> 게시할 때 멤버에게 푸시 알림 보내기</label>
      </div>
      <div class="btns"><button class="btn" id="saveBandBtn">밴드 설정 저장</button></div>
    </div>
  </section>
</main>
<div id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const FIELDS = ['제목','본문','사진','링크','해시태그','밴드글','블로그제목','블로그글','당근글','예약일시','메모'];
let currentId = '';
let photos = [];

function toast(msg, ms) { const t = $('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', ms || 2500); }
function call(fn, ...args) {
  return new Promise((ok, no) => google.script.run.withSuccessHandler(ok).withFailureHandler(e => { toast('오류: ' + (e.message || e), 5000); no(e); })[fn](...args));
}

/* 화면 전환 */
document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x === b));
  ['write','list','settings'].forEach(v => $('view-' + v).classList.toggle('hidden', v !== b.dataset.view));
  if (b.dataset.view === 'list') loadList();
  if (b.dataset.view === 'settings') loadSettings();
});
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b));
  ['band','blog','carrot'].forEach(p => $('pane-' + p).classList.toggle('hidden', p !== b.dataset.pane));
});

/* 채널별 글 만들기 (템플릿) */
function tags(raw, sep) {
  return raw.split(/[\s,]+/).filter(Boolean).map(t => '#' + t.replace(/^#/, '')).join(sep || ' ');
}
function firstLine(title, body) {
  if (title) return title;
  const s = body.split(/\n|(?<=[.!?])\s/)[0] || '';
  return s.slice(0, 40);
}
$('genBtn').onclick = () => {
  const title = $('f-제목').value.trim(), body = $('f-본문').value.trim();
  const link = $('f-링크').value.trim(), tg = $('f-해시태그').value.trim();
  if (!body) return toast('본문을 먼저 써 주세요');
  const anyFilled = ['밴드글','블로그글','당근글'].some(k => $('f-' + k).value.trim());
  if (anyFilled && !confirm('채널별 글을 다시 만들면 수정한 내용이 덮어써집니다. 계속할까요?')) return;

  $('f-밴드글').value =
    (title ? '[' + title + ']\n\n' : '') + body +
    (link ? '\n\n👉 바로가기 ' + link : '') +
    (tg ? '\n\n' + tags(tg) : '');

  $('f-블로그제목').value = title ? title + ' | 골목상회 방앗간' : '';
  $('f-블로그글').value =
    '안녕하세요, 골목상회입니다.\n\n' + body +
    (link ? '\n\n▶ 구매·문의 바로가기\n' + link : '') +
    '\n\n골목상회 | 참기름·들기름·건강즙 방앗간' +
    (tg ? '\n\n' + tags(tg) : '');

  $('f-당근글').value =
    firstLine(title, body) + '\n\n' +
    '이웃님들 안녕하세요, 골목상회예요 :)\n' + body +
    (link ? '\n\n궁금하시면 여기서 보실 수 있어요 → ' + link : '');
  counts();
  toast('채널별 글을 만들었어요. 탭에서 다듬어 주세요.');
};
function counts() {
  $('cnt-밴드글').textContent = $('f-밴드글').value.length + '자';
  $('cnt-당근글').textContent = $('f-당근글').value.length + '자';
}
['f-밴드글','f-당근글'].forEach(id => $(id).addEventListener('input', counts));

/* 사진 */
function renderPhotos() {
  $('f-사진').value = photos.join('\n');
  $('photoList').innerHTML = photos.map((u, i) => '<a href="' + u + '" target="_blank">사진' + (i + 1) + '</a>').join(' ') +
    (photos.length ? ' <a href="#" id="clearPhotos">비우기</a>' : '');
  const c = $('clearPhotos'); if (c) c.onclick = e => { e.preventDefault(); photos = []; renderPhotos(); };
}
$('photoInput').onchange = async e => {
  const files = [...e.target.files];
  for (const f of files) {
    toast('사진 올리는 중… ' + f.name, 10000);
    const b64 = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result.split(',')[1]); fr.readAsDataURL(f); });
    const url = await call('uploadPhoto', f.name, f.type, b64);
    photos.push(url); renderPhotos();
  }
  e.target.value = '';
  toast('사진 ' + files.length + '장 저장됨');
};

/* 저장 */
function collect() {
  const p = { ID: currentId, channels: { band: $('ch-band').checked, blog: $('ch-blog').checked, carrot: $('ch-carrot').checked } };
  FIELDS.forEach(k => p[k] = $('f-' + k).value);
  return p;
}
async function save() {
  if (!$('f-본문').value.trim()) { toast('본문을 써 주세요'); throw new Error('empty'); }
  $('saveBtn').disabled = true;
  try {
    currentId = await call('savePost', collect());
    $('editing').textContent = '수정 중: ' + currentId;
    toast('저장했어요 (' + currentId + ')');
    return currentId;
  } finally { $('saveBtn').disabled = false; }
}
$('saveBtn').onclick = () => save().catch(() => {});
$('bandNowBtn').onclick = async () => {
  if (!$('ch-band').checked) return toast('밴드가 체크되어 있지 않아요');
  if (!confirm('밴드에 지금 바로 게시할까요?')) return;
  try { const id = await save(); toast(await call('postToBand', id), 4000); } catch (e) {}
};
$('askBtn').onclick = async () => {
  try {
    const id = await save();
    const chs = [$('ch-blog').checked && '네이버 블로그', $('ch-carrot').checked && '당근'].filter(Boolean).join('·');
    if (!chs) return toast('블로그·당근이 체크되어 있지 않아요');
    const text = '게시글 시트의 ' + id + ' 글을 ' + chs + '에 올려줘';
    await navigator.clipboard.writeText(text).catch(() => prompt('아래 문구를 복사해 Claude에게 보내세요', text));
    toast('복사됨: ' + text, 4000);
  } catch (e) {}
};
function resetForm() {
  currentId = ''; photos = [];
  FIELDS.forEach(k => $('f-' + k).value = '');
  ['band','blog','carrot'].forEach(c => $('ch-' + c).checked = true);
  $('editing').textContent = '새 글'; renderPhotos(); counts();
}
$('newBtn').onclick = resetForm;

/* 게시 현황 */
function chip(name, st) {
  if (!st || st === '제외') return '';
  const cls = st.startsWith('실패') ? '실패' : st;
  return '<span class="chip ' + cls + '">' + name + ' ' + (cls === '실패' ? '실패' : st) + '</span>';
}
let cache = [];
async function loadList() {
  $('list').innerHTML = '<div class="muted">불러오는 중…</div>';
  cache = await call('listPosts');
  if (!cache.length) { $('list').innerHTML = '<div class="muted">아직 글이 없어요.</div>'; return; }
  $('list').innerHTML = cache.map((p, i) =>
    '<div class="item" data-i="' + i + '"><b>' + esc(p['제목'] || p['본문'].slice(0, 30)) + '</b>' +
    chip('밴드', p['밴드상태']) + chip('블로그', p['블로그상태']) + chip('당근', p['당근상태']) +
    '<div class="muted">' + p.ID + ' · ' + p['작성일시'] + (p['예약일시'] ? ' · 밴드 예약 ' + p['예약일시'] : '') + '</div></div>').join('');
  document.querySelectorAll('.item').forEach(el => el.onclick = () => openPost(cache[el.dataset.i]));
}
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function openPost(p) {
  currentId = p.ID;
  FIELDS.forEach(k => $('f-' + k).value = p[k] || '');
  $('f-예약일시').value = (p['예약일시'] || '').replace(' ', 'T');
  photos = (p['사진'] || '').split('\n').filter(Boolean); renderPhotos();
  $('ch-band').checked = p['밴드상태'] !== '제외';
  $('ch-blog').checked = p['블로그상태'] !== '제외';
  $('ch-carrot').checked = p['당근상태'] !== '제외';
  $('editing').textContent = '수정 중: ' + p.ID;
  counts();
  document.querySelector('nav button[data-view=write]').click();
}
$('reloadBtn').onclick = loadList;

/* 설정 */
async function loadSettings() {
  const s = await call('getSettings');
  $('tokenState').textContent = s.hasToken ? '토큰 저장됨' + (s.bandName ? ' · 게시 밴드: ' + s.bandName : '') : '토큰이 아직 없어요';
  $('s-push').checked = s.doPush;
  if (s.hasToken) loadBands(s.bandKey);
}
async function loadBands(selected) {
  const bands = await call('getBands');
  $('s-band').innerHTML = '<option value="">밴드를 선택하세요</option>' +
    bands.map(b => '<option value="' + b.band_key + '"' + (b.band_key === selected ? ' selected' : '') + '>' + esc(b.name) + ' (' + b.member_count + '명)</option>').join('');
}
$('saveTokenBtn').onclick = async () => {
  const t = $('s-token').value.trim(); if (!t) return toast('토큰을 넣어 주세요');
  await call('saveSettings', { token: t }); $('s-token').value = '';
  toast('토큰 저장됨'); loadSettings();
};
$('saveBandBtn').onclick = async () => {
  const sel = $('s-band');
  const s = await call('saveSettings', { bandKey: sel.value, bandName: sel.value ? sel.options[sel.selectedIndex].text.replace(/ \(\d+명\)$/, '') : '', doPush: $('s-push').checked });
  toast('저장됨'); $('tokenState').textContent = '토큰 저장됨' + (s.bandName ? ' · 게시 밴드: ' + s.bandName : '');
};
</script>
</body>
</html>
